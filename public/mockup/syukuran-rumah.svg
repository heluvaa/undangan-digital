<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#f9f6f1"/>
  
  <!-- Subtle texture -->
  <defs>
    <pattern id="fabric" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#f0ebe3" opacity="0.3"/>
    </pattern>
    <linearGradient id="vintage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b5644;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="600" fill="url(#fabric)"/>
  
  <!-- Decorative corner frames -->
  <path d="M 50 60 L 100 60 M 50 60 L 50 110" stroke="url(#vintage)" stroke-width="2" opacity="0.4"/>
  <path d="M 350 60 L 300 60 M 350 60 L 350 110" stroke="url(#vintage)" stroke-width="2" opacity="0.4"/>
  <path d="M 50 540 L 100 540 M 50 540 L 50 490" stroke="url(#vintage)" stroke-width="2" opacity="0.4"/>
  <path d="M 350 540 L 300 540 M 350 540 L 350 490" stroke="url(#vintage)" stroke-width="2" opacity="0.4"/>
  
  <!-- Header badge -->
  <rect x="130" y="100" width="140" height="32" rx="4" fill="#8b7355" opacity="0.15"/>
  <text x="200" y="122" font-family="serif" font-size="12" fill="#6b5644" text-anchor="middle" letter-spacing="3" font-weight="600">SYUKURAN RUMAH</text>
  
  <!-- House icon -->
  <g transform="translate(200, 170)" opacity="0.3">
    <path d="M 0 -20 L 25 0 L 25 25 L -25 25 L -25 0 Z" fill="#8b7355"/>
    <rect x="-8" y="5" width="16" height="20" fill="#f9f6f1"/>
    <path d="M -30 0 L 0 -25 L 30 0" fill="none" stroke="#8b7355" stroke-width="2"/>
  </g>
  
  <!-- Main content card -->
  <rect x="70" y="210" width="260" height="200" rx="8" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="70" y="210" width="260" height="200" rx="8" fill="none" stroke="#8b7355" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Title -->
  <text x="200" y="250" font-family="serif" font-size="14" fill="#6b5644" text-anchor="middle" opacity="0.7" letter-spacing="1">Alhamdulillah</text>
  <text x="200" y="280" font-family="cursive" font-size="38" fill="#8b7355" text-anchor="middle" font-weight="400">Rumah Baru</text>
  
  <!-- Divider -->
  <g transform="translate(200, 305)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="2" fill="#8b7355" opacity="0.5"/>
  </g>
  
  <!-- Host -->
  <text x="200" y="335" font-family="serif" font-size="12" fill="#6b5644" text-anchor="middle" opacity="0.7">Keluarga</text>
  <text x="200" y="355" font-family="serif" font-size="16" fill="#6b5644" text-anchor="middle" font-weight="600">Bapak Hadi & Ibu Sari</text>
  
  <!-- Event details -->
  <text x="200" y="385" font-family="serif" font-size="14" fill="#8b7355" text-anchor="middle" letter-spacing="0.5">Minggu, 3 November 2026</text>
  <text x="200" y="403" font-family="serif" font-size="12" fill="#6b5644" text-anchor="middle" opacity="0.7">Pukul 09.00 WIB s/d selesai</text>
  
  <!-- Address -->
  <text x="200" y="450" font-family="serif" font-size="14" fill="#6b5644" text-anchor="middle" font-weight="600">Alamat Baru:</text>
  <text x="200" y="470" font-family="serif" font-size="12" fill="#6b5644" text-anchor="middle">Jl. Harmoni Raya No. 77</text>
  <text x="200" y="488" font-family="serif" font-size="12" fill="#6b5644" text-anchor="middle" opacity="0.7">Tangerang Selatan, Banten</text>
  
  <!-- Bottom note -->
  <text x="200" y="530" font-family="serif" font-size="11" fill="#6b5644" text-anchor="middle" opacity="0.6" letter-spacing="1">Hidangan sederhana tersedia</text>
  
  <!-- Footer -->
  <text x="200" y="565" font-family="serif" font-size="9" fill="#6b5644" text-anchor="middle" opacity="0.5" letter-spacing="2">TURUT MENGUNDANG</text>
</svg>
