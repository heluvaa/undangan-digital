<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#faf7f2"/>
  
  <!-- Texture -->
  <defs>
    <pattern id="linen" x="0" y="0" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#f0ebe3" opacity="0.5"/>
    </pattern>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a5a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b48888;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="600" fill="url(#linen)"/>
  
  <!-- Frame -->
  <rect x="40" y="50" width="320" height="500" rx="12" fill="none" stroke="url(#rose)" stroke-width="1.5" opacity="0.5"/>
  <rect x="45" y="55" width="310" height="490" rx="10" fill="none" stroke="url(#rose)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Top decoration -->
  <g transform="translate(200, 100)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="#d4a5a5"/>
    <ellipse cx="-15" cy="5" rx="8" ry="7" fill="#d4a5a5"/>
    <ellipse cx="15" cy="5" rx="8" ry="7" fill="#d4a5a5"/>
  </g>
  
  <!-- Header -->
  <text x="200" y="140" font-family="serif" font-size="11" fill="#8b7070" text-anchor="middle" letter-spacing="3" opacity="0.7">ENGAGEMENT CEREMONY</text>
  
  <!-- Ring icon -->
  <g transform="translate(200, 175)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#d4a5a5" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="-8" r="4" fill="#d4a5a5" opacity="0.5"/>
  </g>
  
  <!-- Names -->
  <text x="200" y="250" font-family="cursive" font-size="50" fill="#b48888" text-anchor="middle" font-weight="300">Sarah</text>
  <text x="200" y="285" font-family="serif" font-size="22" fill="#b48888" text-anchor="middle" opacity="0.6">&amp;</text>
  <text x="200" y="335" font-family="cursive" font-size="50" fill="#b48888" text-anchor="middle" font-weight="300">Kevin</text>
  
  <!-- Divider -->
  <g transform="translate(200, 370)">
    <line x1="-40" y1="0" x2="-10" y2="0" stroke="#d4a5a5" stroke-width="0.8" opacity="0.4"/>
    <circle cx="0" cy="0" r="2.5" fill="#d4a5a5" opacity="0.5"/>
    <line x1="10" y1="0" x2="40" y2="0" stroke="#d4a5a5" stroke-width="0.8" opacity="0.4"/>
  </g>
  
  <!-- Date box -->
  <rect x="110" y="390" width="180" height="70" rx="6" fill="none" stroke="#d4a5a5" stroke-width="1" opacity="0.3"/>
  <text x="200" y="415" font-family="serif" font-size="13" fill="#8b7070" text-anchor="middle" letter-spacing="1">MINGGU</text>
  <text x="200" y="440" font-family="serif" font-size="20" fill="#b48888" text-anchor="middle" font-weight="600">05 • 01 • 2027</text>
  <text x="200" y="456" font-family="serif" font-size="11" fill="#8b7070" text-anchor="middle" opacity="0.6">18.00 WIB</text>
  
  <!-- Venue -->
  <text x="200" y="495" font-family="serif" font-size="13" fill="#8b7070" text-anchor="middle">Hotel Mulia Ballroom</text>
  <text x="200" y="513" font-family="serif" font-size="11" fill="#8b7070" text-anchor="middle" opacity="0.6">Jakarta Selatan</text>
  
  <!-- Bottom decoration -->
  <g transform="translate(200, 545)" opacity="0.3">
    <path d="M -10 0 Q -5 -5 0 0 Q 5 5 10 0" stroke="#d4a5a5" fill="none" stroke-width="1"/>
    <path d="M -10 0 Q -5 5 0 0 Q 5 -5 10 0" stroke="#d4a5a5" fill="none" stroke-width="1"/>
  </g>
</svg>
