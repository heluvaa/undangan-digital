<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#0a0e27"/>
  
  <!-- Stars -->
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <circle cx="80" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="100" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="300" cy="70" r="1.5" fill="#ffffff" opacity="0.7/>
  <circle cx="340" cy="120" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="60" cy="500" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="350" cy="520" r="1.5" fill="#ffffff" opacity="0.7"/>
  
  <!-- Moon -->
  <g opacity="0.15">
    <circle cx="320" cy="100" r="40" fill="#e8dcc4"/>
    <circle cx="335" cy="100" r="40" fill="#0a0e27"/>
  </g>
  
  <!-- Frame -->
  <rect x="50" y="150" width="300" height="320" rx="8" fill="none" stroke="#e8dcc4" stroke-width="1" opacity="0.3"/>
  
  <!-- Islamic pattern -->
  <g transform="translate(200, 200)" opacity="0.2">
    <path d="M 0 -20 L 10 -10 L 20 -20 L 10 -30 Z" fill="#e8dcc4"/>
    <path d="M 0 -20 L -10 -10 L -20 -20 L -10 -30 Z" fill="#e8dcc4"/>
    <path d="M 0 0 L 10 10 L 0 20 L -10 10 Z" fill="#e8dcc4"/>
  </g>
  
  <!-- Bismillah -->
  <text x="200" y="220" font-family="serif" font-size="14" fill="#e8dcc4" text-anchor="middle" letter-spacing="2" opacity="0.9">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</text>
  
  <!-- Maulid Nabi -->
  <text x="200" y="255" font-family="serif" font-size="13" fill="#c9a86a" text-anchor="middle" letter-spacing="3" opacity="0.8">MAULID NABI</text>
  <text x="200" y="275" font-family="serif" font-size="12" fill="#e8dcc4" text-anchor="middle" letter-spacing="2" opacity="0.7">MUHAMMAD SAW</text>
  
  <!-- Main text -->
  <text x="200" y="320" font-family="cursive" font-size="40" fill="#c9a86a" text-anchor="middle" font-weight="400">Peringatan</text>
  <text x="200" y="360" font-family="cursive" font-size="40" fill="#c9a86a" text-anchor="middle" font-weight="400">Maulid Nabi</text>
  
  <!-- Ornament -->
  <g transform="translate(200, 390)">
    <circle cx="0" cy="0" r="3" fill="#c9a86a" opacity="0.6"/>
    <line x1="-35" y1="0" x2="-8" y2="0" stroke="#c9a86a" stroke-width="0.8" opacity="0.4"/>
    <line x1="8" y1="0" x2="35" y2="0" stroke="#c9a86a" stroke-width="0.8" opacity="0.4"/>
  </g>
  
  <!-- Date -->
  <rect x="100" y="410" width="200" height="50" rx="6" fill="none" stroke="#e8dcc4" stroke-width="1" opacity="0.2"/>
  <text x="200" y="435" font-family="serif" font-size="16" fill="#e8dcc4" text-anchor="middle" letter-spacing="1">12 Rabiul Awal 1448 H</text>
  <text x="200" y="453" font-family="serif" font-size="12" fill="#e8dcc4" text-anchor="middle" opacity="0.6">Ahad, 14 September 2026</text>
  
  <!-- Venue -->
  <text x="200" y="495" font-family="serif" font-size="13" fill="#e8dcc4" text-anchor="middle">Masjid Al-Hikmah</text>
  <text x="200" y="515" font-family="serif" font-size="11" fill="#e8dcc4" text-anchor="middle" opacity="0.6">Bandung, Jawa Barat</text>
  
  <!-- Footer -->
  <text x="200" y="555" font-family="serif" font-size="10" fill="#e8dcc4" text-anchor="middle" opacity="0.5" letter-spacing="2">TURUT MENGUNDANG</text>
</svg>
