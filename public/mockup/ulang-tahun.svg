<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#fef3e7"/>
  
  <!-- Confetti pattern -->
  <defs>
    <pattern id="confetti" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="10" y="5" width="3" height="8" fill="#ff6b9d" opacity="0.4" transform="rotate(20 11 9)"/>
      <rect x="35" y="15" width="3" height="8" fill="#ffd93d" opacity="0.4" transform="rotate(-15 36 19)"/>
      <rect x="50" y="35" width="3" height="8" fill="#6bcf7f" opacity="0.4" transform="rotate(45 51 39)"/>
      <circle cx="20" cy="40" r="2" fill="#4ecdc4" opacity="0.3"/>
      <circle cx="45" cy="50" r="2" fill="#ff6b9d" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="400" height="600" fill="url(#confetti)"/>
  
  <!-- Balloon decorations -->
  <g opacity="0.25">
    <ellipse cx="70" cy="100" rx="25" ry="30" fill="#ff6b9d"/>
    <line x1="70" y1="130" x2="65" y2="200" stroke="#ff6b9d" stroke-width="1"/>
    <ellipse cx="330" cy="120" rx="28" ry="33" fill="#ffd93d"/>
    <line x1="330" y1="153" x2="335" y2="220" stroke="#ffd93d" stroke-width="1"/>
    <ellipse cx="90" cy="480" rx="22" ry="27" fill="#4ecdc4"/>
    <line x1="90" y1="507" x2="85" y2="560" stroke="#4ecdc4" stroke-width="1"/>
    <ellipse cx="320" cy="500" rx="24" ry="29" fill="#6bcf7f"/>
    <line x1="320" y1="529" x2="315" y2="580" stroke="#6bcf7f" stroke-width="1"/>
  </g>
  
  <!-- Banner -->
  <path d="M 80 160 L 320 160 L 310 180 L 320 200 L 80 200 L 90 180 Z" fill="#ff6b9d" opacity="0.2"/>
  <text x="200" y="185" font-family="serif" font-size="13" fill="#c7365f" text-anchor="middle" letter-spacing="2" font-weight="700">BIRTHDAY PARTY</text>
  
  <!-- Name -->
  <text x="200" y="270" font-family="cursive" font-size="64" fill="#ff6b9d" text-anchor="middle" font-weight="700">Luna</text>
  
  <!-- Age badge -->
  <g transform="translate(200, 320)">
    <circle cx="0" cy="0" r="35" fill="#ffd93d" opacity="0.3"/>
    <text x="0" y="12" font-family="sans-serif" font-size="40" fill="#f59e0b" text-anchor="middle" font-weight="900">7</text>
  </g>
  
  <!-- Separator -->
  <g transform="translate(200, 385)">
    <path d="M -30 0 L -10 0 M 10 0 L 30 0" stroke="#ff6b9d" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <circle cx="0" cy="0" r="4" fill="#ffd93d" opacity="0.6"/>
  </g>
  
  <!-- Date box -->
  <rect x="90" y="410" width="220" height="65" rx="10" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="90" y="410" width="220" height="65" rx="10" fill="none" stroke="#ff6b9d" stroke-width="2" opacity="0.4"/>
  <text x="200" y="437" font-family="serif" font-size="16" fill="#c7365f" text-anchor="middle" letter-spacing="0.5" font-weight="600">Sabtu, 25 Oktober 2026</text>
  <text x="200" y="458" font-family="serif" font-size="13" fill="#c7365f" text-anchor="middle" opacity="0.7">14.00 - 17.00 WIB</text>
  
  <!-- Venue -->
  <text x="200" y="505" font-family="serif" font-size="14" fill="#c7365f" text-anchor="middle" font-weight="600">Fun Zone Kids Playground</text>
  <text x="200" y="525" font-family="serif" font-size="12" fill="#c7365f" text-anchor="middle" opacity="0.6">Mall Grand Indonesia, Jakarta</text>
  
  <!-- Footer stars -->
  <g transform="translate(200, 560)">
    <path d="M -15 0 L -13 3 L -10 3 L -12 5 L -11 8 L -15 6 L -19 8 L -18 5 L -20 3 L -17 3 Z" fill="#ffd93d" opacity="0.5"/>
    <path d="M 0 0 L 2 3 L 5 3 L 3 5 L 4 8 L 0 6 L -4 8 L -3 5 L -5 3 L -2 3 Z" fill="#ff6b9d" opacity="0.5"/>
    <path d="M 15 0 L 17 3 L 20 3 L 18 5 L 19 8 L 15 6 L 11 8 L 12 5 L 10 3 L 13 3 Z" fill="#4ecdc4" opacity="0.5"/>
  </g>
</svg>
