<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#f3ece1"/>
  
  <!-- Texture -->
  <defs>
    <pattern id="paper" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.3" fill="#e5d5c8" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="400" height="600" fill="url(#paper)"/>
  
  <!-- Top floral corner -->
  <g opacity="0.25">
    <ellipse cx="80" cy="60" rx="25" ry="20" fill="#b07d62" opacity="0.3"/>
    <ellipse cx="100" cy="55" rx="20" ry="18" fill="#b07d62" opacity="0.25"/>
    <ellipse cx="70" cy="80" rx="18" ry="22" fill="#b07d62" opacity="0.28/>
    <ellipse cx="320" cy="60" rx="25" ry="20" fill="#b07d62" opacity="0.3"/>
    <ellipse cx="300" cy="55" rx="20" ry="18" fill="#b07d62" opacity="0.25"/>
    <ellipse cx="330" cy="80" rx="18" ry="22" fill="#b07d62" opacity="0.28"/>
  </g>
  
  <!-- Leaves decoration top -->
  <path d="M 60 50 Q 65 45 70 50 Q 65 55 60 50" fill="#8a5a41" opacity="0.2"/>
  <path d="M 340 50 Q 335 45 330 50 Q 335 55 340 50" fill="#8a5a41" opacity="0.2"/>
  
  <!-- Header -->
  <text x="200" y="120" font-family="serif" font-size="11" fill="#5c4a3d" text-anchor="middle" letter-spacing="4" opacity="0.7">OUR WEDDING DAY</text>
  
  <!-- Names -->
  <text x="200" y="200" font-family="cursive" font-size="56" fill="#b07d62" text-anchor="middle" font-weight="300">Amelia</text>
  
  <!-- Floral divider -->
  <g transform="translate(200, 230)">
    <circle cx="0" cy="0" r="3" fill="#b07d62" opacity="0.4"/>
    <ellipse cx="-15" cy="-2" rx="8" ry="6" fill="#b07d62" opacity="0.2"/>
    <ellipse cx="15" cy="-2" rx="8" ry="6" fill="#b07d62" opacity="0.2"/>
    <ellipse cx="-10" cy="5" rx="6" ry="5" fill="#b07d62" opacity="0.25"/>
    <ellipse cx="10" cy="5" rx="6" ry="5" fill="#b07d62" opacity="0.25"/>
  </g>
  
  <text x="200" y="270" font-family="cursive" font-size="56" fill="#b07d62" text-anchor="middle" font-weight="300">Daniel</text>
  
  <!-- Date box -->
  <rect x="120" y="310" width="160" height="60" rx="4" fill="none" stroke="#b07d62" stroke-width="1" opacity="0.3"/>
  <text x="200" y="335" font-family="serif" font-size="13" fill="#5c4a3d" text-anchor="middle" letter-spacing="1">SABTU</text>
  <text x="200" y="358" font-family="serif" font-size="20" fill="#b07d62" text-anchor="middle" font-weight="600">20 • 12 • 2026</text>
  
  <!-- Venue -->
  <text x="200" y="410" font-family="serif" font-size="14" fill="#5c4a3d" text-anchor="middle">Garden Venue Bali</text>
  <text x="200" y="430" font-family="serif" font-size="12" fill="#5c4a3d" text-anchor="middle" opacity="0.6">Ubud, Bali</text>
  
  <!-- Bottom floral -->
  <g opacity="0.2">
    <ellipse cx="100" cy="520" rx="20" ry="15" fill="#b07d62" opacity="0.3"/>
    <ellipse cx="120" cy="525" rx="15" ry="12" fill="#b07d62" opacity="0.25"/>
    <ellipse cx="300" cy="520" rx="20" ry="15" fill="#b07d62" opacity="0.3"/>
    <ellipse cx="280" cy="525" rx="15" ry="12" fill="#b07d62" opacity="0.25"/>
  </g>
  
  <!-- Footer -->
  <text x="200" y="550" font-family="serif" font-size="10" fill="#5c4a3d" text-anchor="middle" opacity="0.5" letter-spacing="2">DENGAN PENUH KEBAHAGIAAN</text>
</svg>
