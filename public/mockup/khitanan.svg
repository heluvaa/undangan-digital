<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#0f3d33"/>
  
  <!-- Islamic pattern texture -->
  <defs>
    <pattern id="islamic" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 25 10 L 20 20 L 15 10 Z" fill="#1a574a" opacity="0.15"/>
      <circle cx="20" cy="20" r="2" fill="#d4af37" opacity="0.05"/>
    </pattern>
    <linearGradient id="islamicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="600" fill="url(#islamic)"/>
  
  <!-- Top geometric ornament -->
  <g transform="translate(200, 80)" opacity="0.6">
    <path d="M 0 -30 L 15 -10 L 0 10 L -15 -10 Z" fill="url(#islamicGold)" opacity="0.7"/>
    <path d="M 0 -25 L 10 -8 L 0 8 L -10 -8 Z" fill="none" stroke="#d4af37" stroke-width="1"/>
    <circle cx="0" cy="-10" r="3" fill="#d4af37"/>
  </g>
  
  <!-- Header -->
  <text x="200" y="130" font-family="serif" font-size="11" fill="#f2ead8" text-anchor="middle" letter-spacing="3" opacity="0.8">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</text>
  <text x="200" y="155" font-family="serif" font-size="10" fill="#f2ead8" text-anchor="middle" letter-spacing="2" opacity="0.7">WALIMATUL KHITAN</text>
  
  <!-- Main border -->
  <rect x="50" y="180" width="300" height="240" rx="8" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5"/>
  <rect x="55" y="185" width="290" height="230" rx="6" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Child name -->
  <text x="200" y="240" font-family="cursive" font-size="48" fill="#d4af37" text-anchor="middle" font-weight="300">Muhammad</text>
  <text x="200" y="280" font-family="cursive" font-size="48" fill="#d4af37" text-anchor="middle" font-weight="300">Faris</text>
  
  <!-- Small ornament -->
  <g transform="translate(200, 305)">
    <circle cx="0" cy="0" r="2" fill="#d4af37" opacity="0.7"/>
    <line x1="-30" y1="0" x2="-5" y2="0" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
    <line x1="5" y1="0" x2="30" y2="0" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- Details -->
  <text x="200" y="335" font-family="serif" font-size="12" fill="#f2ead8" text-anchor="middle" opacity="0.7">Putra dari</text>
  <text x="200" y="355" font-family="serif" font-size="13" fill="#f2ead8" text-anchor="middle">Bapak Ahmad &amp; Ibu Siti</text>
  
  <!-- Date -->
  <text x="200" y="390" font-family="serif" font-size="16" fill="#d4af37" text-anchor="middle" letter-spacing="1">Minggu, 10 Januari 2027</text>
  <text x="200" y="410" font-family="serif" font-size="13" fill="#f2ead8" text-anchor="middle" opacity="0.7">Pukul 09.00 WIB</text>
  
  <!-- Bottom geometric -->
  <g transform="translate(200, 470)" opacity="0.5">
    <path d="M -20 0 L 0 -15 L 20 0 L 0 15 Z" fill="none" stroke="#d4af37" stroke-width="1"/>
    <path d="M -15 0 L 0 -10 L 15 0 L 0 10 Z" fill="#d4af37" opacity="0.3"/>
  </g>
  
  <!-- Venue -->
  <text x="200" y="510" font-family="serif" font-size="13" fill="#f2ead8" text-anchor="middle">Masjid Al-Ikhlas</text>
  <text x="200" y="530" font-family="serif" font-size="11" fill="#f2ead8" text-anchor="middle" opacity="0.6">Jakarta Selatan</text>
  
  <!-- Footer -->
  <text x="200" y="565" font-family="serif" font-size="9" fill="#f2ead8" text-anchor="middle" opacity="0.5" letter-spacing="2">KAMI YANG BERBAHAGIA</text>
</svg>
