<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#e8f5f0"/>
  
  <!-- Texture -->
  <defs>
    <pattern id="pastel" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#a8d5ba" opacity="0.15"/>
    </pattern>
    <linearGradient id="mint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7cb89d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a9a7f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="600" fill="url(#pastel)"/>
  
  <!-- Cute clouds -->
  <g opacity="0.15">
    <ellipse cx="80" cy="80" rx="25" ry="18" fill="#7cb89d"/>
    <ellipse cx="100" cy="75" rx="30" ry="20" fill="#7cb89d"/>
    <ellipse cx="320" cy="90" rx="28" ry="19" fill="#7cb89d"/>
    <ellipse cx="300" cy="85" rx="22" ry="16" fill="#7cb89d"/>
  </g>
  
  <!-- Header -->
  <text x="200" y="120" font-family="serif" font-size="12" fill="#4a7c59" text-anchor="middle" letter-spacing="3" opacity="0.8">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</text>
  
  <!-- Title badge -->
  <rect x="130" y="140" width="140" height="32" rx="16" fill="url(#mint)" opacity="0.2"/>
  <text x="200" y="162" font-family="serif" font-size="13" fill="#4a7c59" text-anchor="middle" letter-spacing="2" font-weight="600">AKIKAH</text>
  
  <!-- Card -->
  <rect x="50" y="200" width="300" height="260" rx="16" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="50" y="200" width="300" height="260" rx="16" fill="none" stroke="#a8d5ba" stroke-width="2"/>
  
  <!-- Baby name -->
  <text x="200" y="260" font-family="cursive" font-size="46" fill="#5a9a7f" text-anchor="middle" font-weight="400">Zahra</text>
  <text x="200" y="300" font-family="cursive" font-size="46" fill="#5a9a7f" text-anchor="middle" font-weight="400">Aliyah</text>
  
  <!-- Cute star -->
  <g transform="translate(200, 330)">
    <path d="M 0 -8 L 2 -2 L 8 -2 L 3 2 L 5 8 L 0 4 L -5 8 L -3 2 L -8 -2 L -2 -2 Z" fill="#f4d35e" opacity="0.6"/>
  </g>
  
  <!-- Info -->
  <text x="200" y="360" font-family="serif" font-size="12" fill="#4a7c59" text-anchor="middle" opacity="0.7">Putri dari</text>
  <text x="200" y="380" font-family="serif" font-size="13" fill="#4a7c59" text-anchor="middle">Bapak Fajar &amp; Ibu Dina</text>
  
  <!-- Date in rounded box -->
  <rect x="100" y="400" width="200" height="45" rx="8" fill="#a8d5ba" fill-opacity="0.15"/>
  <text x="200" y="420" font-family="serif" font-size="15" fill="#4a7c59" text-anchor="middle" letter-spacing="0.5">Sabtu, 12 Oktober 2026</text>
  <text x="200" y="437" font-family="serif" font-size="12" fill="#4a7c59" text-anchor="middle" opacity="0.7">09.30 - 12.00 WIB</text>
  
  <!-- Venue -->
  <text x="200" y="490" font-family="serif" font-size="13" fill="#4a7c59" text-anchor="middle">Rumah Keluarga</text>
  <text x="200" y="510" font-family="serif" font-size="11" fill="#4a7c59" text-anchor="middle" opacity="0.6">Jl. Melati No. 45, Surabaya</text>
  
  <!-- Bottom decoration -->
  <g transform="translate(200, 545)">
    <circle cx="-20" cy="0" r="4" fill="#f4d35e" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#7cb89d" opacity="0.4"/>
    <circle cx="20" cy="0" r="4" fill="#f4d35e" opacity="0.5"/>
  </g>
  
  <!-- Footer -->
  <text x="200" y="575" font-family="serif" font-size="9" fill="#4a7c59" text-anchor="middle" opacity="0.5" letter-spacing="2">MOHON DOA RESTU</text>
</svg>
